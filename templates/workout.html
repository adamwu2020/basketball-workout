<!DOCTYPE html>
<html>
<head>
  <title>{{ workout.label }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    h2 {
      color: #555;
      margin-top: 20px;
    }
    .info {
      margin: 10px 0;
      color: #444;
    }
    ol {
      margin-top: 10px;
      padding-left: 20px;
    }
    li {
      margin: 8px 0;
      color: #333;
      line-height: 1.5;
    }
    .links {
      margin-top: 30px;
    }
    .links a {
      margin-right: 20px;
      color: #ff8c00;
    }
  </style>
</head>
<body>
  <h1>{{ workout.label }}</h1>
  <p style="color: #777;">Category: {{ category_label }}</p>

  <div class="info"><strong>Duration:</strong> {{ workout.duration }}</div>
  <div class="info"><strong>Reps:</strong> {{ workout.reps }}</div>
  <div class="info"><strong>Focus:</strong> {{ workout.focus }}</div>

  <h2>Instructions</h2>
  <ol>
    {% for step in workout.instructions %}
    <li>{{ step }}</li>
    {% endfor %}
  </ol>

  <div class="links">
    <a href="{{ url_for('workout', category=category_key) }}">Give me a different drill</a>
    <a href="{{ url_for('index') }}">Back to categories</a>
  </div>
</body>
</html>
