<!DOCTYPE html>
<html>
<head>
  <title>Basketball Workout Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
    }
    .category-list {
      margin-top: 20px;
    }
    .category-btn {
      display: block;
      width: 250px;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      background-color: #ff8c00;
      color: white;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .category-btn:hover {
      background-color: #e07b00;
    }
  </style>
</head>
<body>
  <h1>Basketball Workout Generator</h1>
  <p>Choose a workout category below. The program will randomly pick a drill for you.</p>

  <div class="category-list">
    {% for key, cat in categories.items() %}
    <a class="category-btn" href="{{ url_for('workout', category=key) }}">{{ cat.label }}</a>
    {% endfor %}
  </div>
</body>
</html>
